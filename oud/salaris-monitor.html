<title>Salaris Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style id="stijl">
/* Salaris Monitor — instrumentenpaneel bij nacht.
   Blauwzwarte grond, ivoren cijfers, amber als naald. Groen en rood zijn
   uitsluitend signaalkleuren: op schema of eroverheen. */

:root {
  --grond: #0a0f14;
  --vlak: #111a22;
  --vlak-2: #17222c;
  --vlak-3: #1e2b36;
  --lijn: #24323e;
  --lijn-fel: #33454f;

  --tekst: #e9f1f5;
  --zacht: #93a3b0;
  --zachter: #6e8291;

  --amber: #f5a524;
  --amber-dof: rgba(245, 165, 36, .12);
  --goed: #35c48b;
  --goed-dof: rgba(53, 196, 139, .12);
  --fout: #f2555a;
  --fout-dof: rgba(242, 85, 90, .12);
  --koel: #5ea8e0;

  --r: 14px;
  --r-s: 9px;

  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --ui: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 0 0 5rem;
  background: var(--grond);
  color: var(--tekst);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }

/* ------------------------------------------------------------------ layout */
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 1.25rem; }

header.top {
  position: sticky; top: 0; z-index: 20;
  background: rgba(10, 15, 20, .92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--lijn);
}
.top-in {
  max-width: 1060px; margin: 0 auto; padding: .8rem 1.25rem;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.merk {
  font-family: var(--display); font-weight: 700; font-size: 1.02rem;
  letter-spacing: -.02em;
}
.merk span { color: var(--zachter); font-weight: 500; font-family: var(--ui); letter-spacing: 0; }

nav.tabs { display: flex; gap: .3rem; margin-left: auto; }
nav.tabs button {
  background: transparent; border: 1px solid transparent; color: var(--zacht);
  padding: .5rem .9rem; border-radius: 999px; font-size: .92rem; cursor: pointer;
  font-family: inherit; font-weight: 600;
}
nav.tabs button:hover { color: var(--tekst); background: var(--vlak-2); }
nav.tabs button.actief { background: var(--tekst); color: var(--grond); }

section.blok { margin: 2rem 0; }
h2.kop {
  font-size: .74rem; text-transform: uppercase; letter-spacing: .16em;
  color: var(--zachter); margin: 0 0 .8rem; font-weight: 700;
}
h3 { font-size: 1rem; margin: 0 0 .7rem; font-weight: 650; letter-spacing: -.01em; }

.kaart { background: var(--vlak); border: 1px solid var(--lijn); border-radius: var(--r); padding: 1.25rem; }
.rooster { display: grid; gap: .9rem; }
.k2 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.k3 { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
.k-invoer { grid-template-columns: minmax(320px, 1.15fr) minmax(280px, 1fr); }

/* ---------------------------------------------------------------- getallen */
.mega, .groot, .middel, .num, table.lijst td.r, table.lijst th.r, input {
  font-variant-numeric: tabular-nums;
}
.mega {
  font-family: var(--display); font-size: clamp(2.5rem, 9vw, 4.2rem);
  font-weight: 800; letter-spacing: -.045em; line-height: .96;
}
.groot {
  font-family: var(--display); font-size: clamp(1.65rem, 4.5vw, 2.3rem);
  font-weight: 700; letter-spacing: -.035em; line-height: 1.05;
}
.middel { font-family: var(--display); font-size: 1.3rem; font-weight: 650; letter-spacing: -.02em; }
.label {
  font-size: .72rem; color: var(--zacht); text-transform: uppercase;
  letter-spacing: .13em; font-weight: 650;
}
.zacht { color: var(--zacht); }
.zachter { color: var(--zachter); }
.groen { color: var(--goed); }
.rood { color: var(--fout); }
.geel { color: var(--amber); }

/* ------------------------------------------------------------ auto-ladder */
.hero {
  background:
    radial-gradient(120% 90% at 85% 0%, rgba(245,165,36,.10) 0%, rgba(245,165,36,0) 55%),
    linear-gradient(168deg, #16222c 0%, #0f1720 65%);
  border: 1px solid var(--lijn-fel); border-radius: 20px; padding: 1.7rem;
}
.hero-boven { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.trede-naam {
  font-family: var(--display); font-size: clamp(1.75rem, 6vw, 3rem); font-weight: 800;
  letter-spacing: -.04em; line-height: 1.02; margin: .3rem 0 0; text-wrap: balance;
  color: var(--amber);
}
.regel-werk { margin-top: 1.1rem; font-size: clamp(1.02rem, 2.3vw, 1.25rem); font-weight: 600; }
.regel-werk b { color: var(--amber); font-family: var(--display); letter-spacing: -.02em; }

/* meterbalken */
.balk { height: 8px; border-radius: 999px; background: var(--vlak-3); overflow: hidden; }
.balk > i { display: block; height: 100%; border-radius: 999px; background: var(--amber); transition: width .35s ease; }
.balk-uiteinden { display: flex; justify-content: space-between; gap: 1rem; font-size: .78rem; color: var(--zachter); margin-top: .45rem; }

.ladder { margin-top: 1.5rem; display: grid; gap: .25rem; }
.trede {
  display: grid; grid-template-columns: 1.4rem 1fr auto; align-items: center; gap: .7rem;
  padding: .45rem .65rem; border-radius: var(--r-s); font-size: .92rem;
  color: var(--zachter); border: 1px solid transparent;
}
.trede .nr { font-size: .74rem; text-align: center; font-variant-numeric: tabular-nums; }
.trede.bereikt { color: var(--zacht); }
.trede.bereikt .nr { color: var(--goed); }
.trede.nu { background: var(--amber-dof); border-color: rgba(245,165,36,.4); color: var(--tekst); font-weight: 650; }
.trede.nu .nr { color: var(--amber); }
.trede.volgend { background: var(--vlak-2); border-color: var(--lijn); color: var(--tekst); }

/* -------------------------------------------------------------- deze maand */
.maandkaart { display: grid; gap: 1.3rem; grid-template-columns: minmax(250px, 1.05fr) minmax(250px, 1fr); }

.tempo-balk { position: relative; height: 12px; border-radius: 999px; background: var(--vlak-3); margin-top: 1rem; }
.tempo-balk > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.tempo-balk > .marker { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--tekst); border-radius: 2px; }
.tempo-legenda { display: flex; justify-content: space-between; font-size: .78rem; color: var(--zachter); margin-top: .45rem; }

.statuslijn { padding: .75rem .95rem; border-radius: var(--r-s); font-weight: 650; font-size: 1rem; }
.statuslijn.ok { background: var(--goed-dof); color: var(--goed); }
.statuslijn.niet { background: var(--fout-dof); color: var(--fout); }

/* ------------------------------------------------------------------ potjes */
.pot { background: var(--vlak); border: 1px solid var(--lijn); border-radius: var(--r); padding: 1rem 1.1rem; }
.pot .naam { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.pot .bedrag { margin: .4rem 0 .7rem; }
.pot .doel { font-size: .8rem; color: var(--zachter); margin-top: .45rem; }

/* ------------------------------------------------------------------ lijsten */
.tabel-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.lijst { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.lijst th {
  text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .12em;
  color: var(--zachter); font-weight: 700; padding: .5rem .55rem; border-bottom: 1px solid var(--lijn);
  white-space: nowrap;
}
table.lijst td { padding: .6rem .55rem; border-bottom: 1px solid var(--lijn); vertical-align: middle; }
table.lijst tr:last-child td { border-bottom: none; }
table.lijst td.r, table.lijst th.r { text-align: right; }

/* --------------------------------------------------------------- formulier */
label.veld { display: block; margin-bottom: .95rem; }
label.veld > span.t { display: block; font-size: .8rem; color: var(--zacht); margin-bottom: .35rem; font-weight: 600; }
label.veld > span.u { display: block; font-size: .78rem; color: var(--zachter); margin-top: .35rem; line-height: 1.45; }
.veld > span.t { display: block; font-size: .8rem; color: var(--zacht); margin-bottom: .35rem; font-weight: 600; }
.veld > span.u { display: block; font-size: .78rem; color: var(--zachter); margin-top: .35rem; line-height: 1.45; }

input, select, textarea {
  width: 100%; background: var(--grond); border: 1px solid var(--lijn); color: var(--tekst);
  border-radius: var(--r-s); padding: .62rem .7rem; font-size: 16px; font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: -1px; border-color: transparent; }
input[type=checkbox] { width: auto; }
textarea { min-height: 68px; resize: vertical; line-height: 1.45; }

.knop {
  background: var(--tekst); color: var(--grond); border: none; border-radius: var(--r-s);
  padding: .65rem 1.05rem; font-size: .94rem; font-weight: 700; cursor: pointer; font-family: inherit;
}
.knop.zacht { background: var(--vlak-2); color: var(--tekst); border: 1px solid var(--lijn); }
.knop.mini { padding: .38rem .65rem; font-size: .82rem; }
.knop.gevaar { background: transparent; color: var(--fout); border: 1px solid rgba(242,85,90,.35); }
.knop:hover { opacity: .87; }
.knoppen { display: flex; gap: .55rem; flex-wrap: wrap; align-items: center; }

.rij { display: grid; grid-template-columns: 1fr 140px 40px; gap: .5rem; margin-bottom: .5rem; align-items: center; }
.rij-res { grid-template-columns: 1fr 110px 128px 128px 40px; }
.rij-vs { grid-template-columns: 1fr 110px 128px 40px; }
.rij .weg {
  background: transparent; border: 1px solid var(--lijn); color: var(--zachter);
  border-radius: var(--r-s); height: 40px; cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 0;
}
.rij .weg:hover { color: var(--fout); border-color: rgba(242,85,90,.4); }

.notitie { font-size: .88rem; color: var(--zacht); line-height: 1.55; }
.leeg {
  border: 1px dashed var(--lijn-fel); border-radius: var(--r); padding: 1.4rem;
  color: var(--zacht); font-size: .98rem; line-height: 1.6;
}
.chip {
  display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .7rem;
  font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.chip.open { background: var(--amber-dof); color: var(--amber); }
.chip.klaar { background: var(--goed-dof); color: var(--goed); }

.mijlpaal {
  display: grid; grid-template-columns: 1fr auto auto; gap: .9rem;
  padding: .65rem .1rem; border-bottom: 1px solid var(--lijn); align-items: baseline;
}
.mijlpaal:last-child { border-bottom: none; }
.mijlpaal .wanneer { font-weight: 650; font-variant-numeric: tabular-nums; }

svg.grafiek { width: 100%; height: auto; display: block; }
.legenda { display: flex; gap: 1.1rem; flex-wrap: wrap; font-size: .84rem; margin-top: .8rem; color: var(--zacht); }
.legenda i { display: inline-block; width: 20px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .4rem; }

.grote-regel {
  margin-top: 1.1rem; padding: .95rem 1.1rem; border-radius: var(--r-s);
  background: var(--vlak-2); font-size: 1rem; line-height: 1.5; border: 1px solid var(--lijn);
}
.grote-regel b { color: var(--amber); font-family: var(--display); letter-spacing: -.02em; }

/* -------------------------------------------------------- opslag-indicator */
.opslag {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 1rem; z-index: 40;
  background: var(--vlak-2); border: 1px solid var(--lijn-fel); color: var(--zacht);
  padding: .5rem .9rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
  display: flex; align-items: center; gap: .5rem; box-shadow: 0 6px 24px rgba(0,0,0,.45);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.opslag.zichtbaar { opacity: 1; }
.opslag i { width: 7px; height: 7px; border-radius: 50%; background: var(--zachter); }
.opslag.bezig i { background: var(--amber); }
.opslag.klaar i { background: var(--goed); }
.opslag.mis i { background: var(--fout); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ------------------------------------------------------------------ mobiel */
@media (max-width: 760px) {
  .wrap { padding: 0 .9rem; }
  .top-in { padding: .7rem .9rem; gap: .6rem; }
  .merk span { display: none; }
  nav.tabs { width: 100%; margin-left: 0; }
  nav.tabs button { flex: 1; padding: .55rem .4rem; font-size: .88rem; }
  section.blok { margin: 1.4rem 0; }
  .hero { padding: 1.2rem; border-radius: 16px; }
  .hero-boven { display: block; }
  .hero-boven > div:last-child { text-align: left !important; margin-top: 1rem;
    display: flex; gap: 1.2rem; align-items: baseline; flex-wrap: wrap; }
  .ladder { margin-top: 1.2rem; }
  .maandkaart, .k-invoer { grid-template-columns: 1fr; }
  .kaart { padding: 1rem; }
  .rij { grid-template-columns: 1fr 96px 40px; }
  .pot { padding: .85rem .9rem; }
  .pot .naam { display: block; }
  .pot .naam > span:last-child { display: block; margin-top: .15rem; }
  .rij-res, .rij-vs { grid-template-columns: 1fr 1fr; }
  .rij-res > :last-child, .rij-vs > :last-child { grid-column: 1 / -1; }
  .mijlpaal { grid-template-columns: 1fr auto; row-gap: .2rem; }
  .mijlpaal .wanneer { grid-column: 1 / -1; font-size: .88rem; }
  table.lijst { font-size: .88rem; }
}

</style>

<script id="code">
/* Salaris Monitor — alles in één bestand. Bron: github.com/davidvossvoss-hue/monitor */

/* ============================================================================
   Salaris Monitor — rekenmodel
   Puur rekenwerk. Geen DOM, geen opslag, geen aannames over gedrag.
   Draait in de browser (window.Model) en in node (module.exports).
   ========================================================================= */
(function (root) {
  'use strict';

  // --------------------------------------------------------------------------
  // Standaardinstellingen. Alles hier is aanpasbaar in het instellingenscherm.
  // --------------------------------------------------------------------------
  var STANDAARD_INSTELLINGEN = {
    // Vaste lasten wonen & eten lopen via de gezamenlijke pas.
    // Van het totaal dat daar afgaat is dit mijn deel:
    gezamenlijkePasMijnDeelPct: 50,
    // Gepland maandbedrag naar de gezamenlijke pas. Alleen gebruikt zolang er
    // nog geen maand is ingevuld — daarna rekent alles met gemeten cijfers.
    gezamenlijkePasPlan: 1800,

    // Vaste lasten overig: vrije lijst.
    vasteLastenOverig: [
      { naam: 'AI-abonnementen', bedrag: 60 },
      { naam: 'Telefoon', bedrag: 25 },
      { naam: 'Tanken', bedrag: 150 },
      { naam: 'Verzekeringen', bedrag: 165 }
    ],

    // Verdeling van het surplus.
    surplusInvesterenPct: 70,

    // Binnen het investeringsdeel, na de oorlogskas:
    autopotPctNaOorlogskas: 60,

    // Oorlogskas: doel = maanden x totale burn rate (incl. gezamenlijke pas
    // en dagelijkse uitgaven). Handmatig doel overschrijft de berekening.
    oorlogskasMaanden: 6,
    oorlogskasDoelHandmatig: null,

    // Jaarruimte: deel van de beleggingsinleg dat je apart zet voor je
    // jaarruimte. 0 = uit.
    jaarruimteDeelVanBeleggenPct: 0,
    jaarruimteDoelPerJaar: 0,

    // Projectie.
    rendementPct: 7,
    strengerExtraPerMaand: 250,
    projectieJaren: 20,

    // Financiële vrijheid = gewenst maandinkomen x 12 / opnamepercentage.
    gewenstMaandinkomen: 3000,
    opnamePct: 4,

    // Weekbedrag = maandbedrag / dit getal.
    wekenPerMaand: 4.33,

    // Beginstanden van de potjes (wat er al stond voordat je begon te loggen).
    startSaldi: {
      oorlogskas: 0,
      autopot: 0,
      beleggen: 0,
      jaarruimte: 0,
      besteedbaar: 0
    },

    autoLadder: [
      { naam: 'Huidige auto houden', vanaf: 1500 },
      { naam: 'Honda Civic 2011', vanaf: 6000 },
      { naam: 'Lexus CT 200h', vanaf: 14000 },
      { naam: 'Hyundai Tucson 2020', vanaf: 19000 },
      { naam: 'Volkswagen Tiguan 2020', vanaf: 29000 },
      { naam: 'Porsche Cayman', vanaf: 35000 },
      { naam: 'Lexus RX450h', vanaf: 49000 },
      { naam: 'Volvo XC90', vanaf: 60000 },
      { naam: 'Land Rover Defender 2024', vanaf: 90000 }
    ]
  };

  // --------------------------------------------------------------------------
  // Hulpjes
  // --------------------------------------------------------------------------
  function getal(x) {
    var n = typeof x === 'string' ? parseFloat(x.replace(',', '.')) : x;
    return typeof n === 'number' && isFinite(n) ? n : 0;
  }

  function som(lijst, veld) {
    return (lijst || []).reduce(function (t, r) {
      return t + getal(veld ? r[veld] : r);
    }, 0);
  }

  function maandSleutel(datum) {
    var d = datum ? new Date(datum) : new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function maandPlus(sleutel, n) {
    var p = String(sleutel).split('-');
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + n, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function maandenPerJaar() { return 12; }

  function vasteLastenOverigTotaal(instellingen) {
    return som(instellingen.vasteLastenOverig, 'bedrag');
  }

  function eigenUitgavenTotaal(maand) {
    if (!maand) return 0;
    if (Array.isArray(maand.eigenUitgaven)) return som(maand.eigenUitgaven, 'bedrag');
    return getal(maand.eigenUitgaven);
  }

  // --------------------------------------------------------------------------
  // Burn rate: wat mijn leven per maand kost.
  // Gezamenlijke pas (mijn deel) + vaste lasten overig + wat ik echt uitgeef.
  // Reserveringen en voorgeschoten geld tellen NIET mee: dat is geen verbruik.
  // --------------------------------------------------------------------------
  function burnVanMaand(maand, instellingen, reserveringen, voorschotten) {
    var mijnDeel = getal(maand.gezamenlijkePasTotaal) *
      getal(instellingen.gezamenlijkePasMijnDeelPct) / 100;
    return mijnDeel +
      vasteLastenOverigTotaal(instellingen) +
      effectieveUitgaven(maand, reserveringen, voorschotten);
  }

  // Wat er echt uit mijn besteedbare geld ging.
  // Eraf: voorgeschoten geld (krijg ik terug) en betalingen die al gereserveerd
  // waren (die zijn eerder al van het salaris af gegaan).
  function effectieveUitgaven(maand, reserveringen, voorschotten) {
    var bruto = eigenUitgavenTotaal(maand);
    var voorgeschoten = som((voorschotten || []).filter(function (v) {
      return v.maand === maand.maand;
    }), 'bedrag');
    var gereserveerdBetaald = som((reserveringen || []).filter(function (r) {
      return r.betaaldMaand === maand.maand;
    }), 'bedrag');
    return bruto - voorgeschoten - gereserveerdBetaald;
  }

  // --------------------------------------------------------------------------
  // Oorlogskasdoel
  // --------------------------------------------------------------------------
  function oorlogskasDoel(instellingen, gemiddeldeBurn) {
    if (instellingen.oorlogskasDoelHandmatig != null &&
        getal(instellingen.oorlogskasDoelHandmatig) > 0) {
      return { bedrag: getal(instellingen.oorlogskasDoelHandmatig), schatting: false };
    }
    if (gemiddeldeBurn != null) {
      return {
        bedrag: getal(instellingen.oorlogskasMaanden) * gemiddeldeBurn,
        schatting: false
      };
    }
    // Nog geen maand ingevuld: dan is dit een plan, geen meting.
    var planBurn = getal(instellingen.gezamenlijkePasPlan) +
      vasteLastenOverigTotaal(instellingen);
    return {
      bedrag: getal(instellingen.oorlogskasMaanden) * planBurn,
      schatting: true
    };
  }

  // --------------------------------------------------------------------------
  // Eén maand doorrekenen, gegeven de stand van de potjes aan het begin.
  // --------------------------------------------------------------------------
  function berekenMaand(maand, instellingen, stand, doelOorlogskas, reserveringen, voorschotten) {
    var i = instellingen;

    var salaris = getal(maand.salaris);
    var gezamenlijkTotaal = getal(maand.gezamenlijkePasTotaal);
    var mijnDeelGezamenlijk = gezamenlijkTotaal * getal(i.gezamenlijkePasMijnDeelPct) / 100;
    var vasteOverig = vasteLastenOverigTotaal(i);

    var reserveringInleg = som((reserveringen || []).filter(function (r) {
      return r.inlegMaand === maand.maand;
    }), 'bedrag');
    var reserveringVrijgevallen = som((reserveringen || []).filter(function (r) {
      return r.betaaldMaand === maand.maand;
    }), 'bedrag');

(function (root) {
  'use strict';
  var SLEUTEL = 'salaris-monitor-v1';

    return {
      instellingen: JSON.parse(JSON.stringify(root.Model.STANDAARD_INSTELLINGEN)),
      maanden: [],
      reserveringen: [],
      voorschotten: []
    };
  }

  function laden() {
    try {
      var ruw = localStorage.getItem(SLEUTEL);
      if (!ruw) return leeg();
      var d = JSON.parse(ruw);
      var basis = leeg();
      d.instellingen = Object.assign({}, basis.instellingen, d.instellingen || {});
      d.instellingen.startSaldi = Object.assign({}, basis.instellingen.startSaldi, d.instellingen.startSaldi || {});
      d.maanden = d.maanden || [];
      d.reserveringen = d.reserveringen || [];
      d.voorschotten = d.voorschotten || [];
      return d;
    } catch (e) {
      console.warn('Opslag onleesbaar, opnieuw begonnen.', e);
      return leeg();
    }
  }

  function bewaren(data) {
    try { localStorage.setItem(SLEUTEL, JSON.stringify(data)); }
    catch (e) { console.warn('Kon niet opslaan.', e); }
  }

  function wissen() { localStorage.removeItem(SLEUTEL); }

  function id() {
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  root.Store = { laden: laden, bewaren: bewaren, wissen: wissen, leeg: leeg, id: id, SLEUTEL: SLEUTEL };

      bezig = false;
      var code = e && e.code;
      if (code === 'conflict') toon('mis', 'elders bijgewerkt', true);
      else if (code === 'not_granted' || code === 'not_writer') { artefact = null; toon('mis', 'alleen-lezen: bewaard op dit toestel', true); }
      else toon('mis', 'opslaan mislukt — staat wel op dit toestel', true);
    });
  }

  // Een gepubliceerde pagina kan geen bestand aanbieden via een gewone link:
  // dat loopt via de downloads-capability, met een bevestiging voor de viewer.
  // Daarom hier altijd de link-fallback vervangen, ook als downloads ontbreekt.
  var downloads = null;
  root.bewaarBestand = function (naam, inhoud) {
    if (!downloads) { toon('mis', 'downloaden kan hier niet — je gegevens staan in de link', true); return; }
    downloads.save({ filename: naam, data: inhoud }).then(function () {
      toon('klaar', 'bestand opgeslagen');
    }).catch(function (e) {
      var c = e && e.code;
      toon('mis', c === 'declined' ? 'download geannuleerd' : 'downloaden lukte niet', true);
    });
  };
  if (root.claude && root.claude.use) {
    root.claude.use('downloads').then(function (d) { downloads = d; })
      .catch(function () { /* blijft null */ });
  }

  window.addEventListener('pagehide', bewaarUI);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { bewaarUI(); }
    else if (vuil) { clearTimeout(klok); klok = setTimeout(probeer, 1200); }
  });

  // Tik op het lampje = nu opslaan.
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#opslag')) { clearTimeout(klok); probeer(); }
  });

  // ------------------------------------------------------------ de pagina zelf
  // Wordt opgebouwd uit de bron van deze pagina (stijl + code, ongewijzigd)
  // plus de huidige gegevens. Nooit uit de getekende DOM.
  function bouwDocument() {
    var stijl = document.getElementById('stijl').textContent;
    var code = document.getElementById('code').textContent;
    var data = JSON.stringify(root.App.state()).replace(/</g, '\\u003c');
    var eind = '</' + 'script>';
    return '<!doctype html>\n<html lang="nl">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      '<meta name="color-scheme" content="dark">\n<title>Salaris Monitor</title>\n' +
      FONTS + '\n<style id="stijl">' + stijl + '</style>\n</head>\n<body>\n' +
      SCHIL + '\n<script id="staat" type="application/json">' + data + eind + '\n' +
      '<script id="code">' + code + eind + '\n</body>\n</html>';
  }
})(window);


/* Lijm: schermen, binding, acties. */
(function (root) {
  'use strict';
  var M = root.Model, U = root.UI, S = root.Store;

  var state = S.laden();
  var ui = root.beginUI || { tab: 'dashboard', maand: M.maandSleutel() };

  var el = { app: null, tabs: null };

  function bewaar() { S.bewaren(state); }

  function render() {
    var h;
    if (ui.tab === 'invoer') h = root.Invoer.render(state, ui.maand);
    else if (ui.tab === 'instellingen') h = root.Instellingen.render(state);
    else h = root.Dashboard.render(state);
    el.app.innerHTML = h;
    Array.prototype.forEach.call(el.tabs.querySelectorAll('button'), function (b) {
      b.classList.toggle('actief', b.dataset.tab === ui.tab);
    });
  }

  // Nooit hertekenen terwijl je in een veld staat: dat wist je selectie en je
  // cursor. We wachten netjes tot je het formulier verlaat.
  var timer = null, rendernodig = false;

  function inFormulier() {
    var a = document.activeElement;
    return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && el.app.contains(a);
  }

  function herteken() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (inFormulier()) { rendernodig = true; ververLive(); return; }
      rendernodig = false;
      render();
    }, 0);
  }

  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (rendernodig && !inFormulier()) { rendernodig = false; render(); }
    }, 0);
  });

  function ververLive() {
    var doel = document.getElementById('live');
    if (doel) doel.innerHTML = root.Invoer.liveHTML(state, ui.maand);
  }

  // ------------------------------------------------------------- databinding
  function pakWaarde(inp) {
    if (inp.type === 'number') {
      if (inp.value.trim() === '') return inp.dataset.bind.indexOf('Handmatig') > -1 ? null : 0;
      var n = parseFloat(inp.value.replace(',', '.'));
      return isFinite(n) ? n : 0;
    }
    return inp.value;
  }

  document.addEventListener('input', function (e) {
    var inp = e.target;
    if (!inp.dataset || !inp.dataset.bind) return;
    U.zetPad(state, inp.dataset.bind, pakWaarde(inp));
    bewaar();
    if (ui.tab === 'invoer') ververLive();
  });

  document.addEventListener('change', function (e) {
    var inp = e.target;
    if (inp.dataset && inp.dataset.actie === 'kies-maand') {
      ui.maand = inp.value; render(); return;
    }
    if (inp.id === 'import-bestand' && inp.files && inp.files[0]) {
      var lezer = new FileReader();
      lezer.onload = function () {
        try {
          var d = JSON.parse(lezer.result);
          if (!d || typeof d !== 'object') throw new Error('geen object');
          state = Object.assign(S.leeg(), d);
          state.instellingen = Object.assign(S.leeg().instellingen, d.instellingen || {});
          bewaar(); render();
        } catch (err) { alert('Kon dit bestand niet lezen: ' + err.message); }
      };
      lezer.readAsText(inp.files[0]);
      return;
    }
    if (inp.dataset && inp.dataset.bind) {
      U.zetPad(state, inp.dataset.bind, pakWaarde(inp));
      bewaar(); herteken();
    }
  });

  // ------------------------------------------------------------------ acties
  function waarde(id) {
    var e = document.getElementById(id);
    return e ? e.value.trim() : '';
  }
  function nummer(id) {
    var v = waarde(id).replace(',', '.');
    var n = parseFloat(v);
    return isFinite(n) ? n : 0;
  }
  function huidigeMaand() { return root.Invoer.maandIndex(state, ui.maand); }

  var acties = {
    tab: function (d) { ui.tab = d.tab; render(); window.scrollTo({ top: 0 }); },

    'nieuwe-maand': function () {
      var v = waarde('nieuwe-maand-veld');
      if (v) { ui.maand = v; render(); window.scrollTo({ top: 0 }); }
    },
    'maand-aanmaken': function (d) {
      root.Invoer.zorgVoorMaand(state, d.maand || ui.maand);
      bewaar(); render();
    },
    'maand-weg': function () {
      if (!confirm('Maand ' + U.maandLabel(ui.maand) + ' verwijderen?')) return;
      state.maanden = state.maanden.filter(function (m) { return m.maand !== ui.maand; });
      bewaar(); render();
    },
    'uitgave-erbij': function () {
      var i = huidigeMaand(); if (i < 0) return;
      state.maanden[i].eigenUitgaven = state.maanden[i].eigenUitgaven || [];
      state.maanden[i].eigenUitgaven.push({ omschrijving: '', bedrag: 0 });
      bewaar(); render();
    },
    'uitgave-weg': function (d) {
      var i = huidigeMaand(); if (i < 0) return;
      state.maanden[i].eigenUitgaven.splice(parseInt(d.i, 10), 1);
      bewaar(); render();
    },

    'reservering-erbij': function () {
      var naam = waarde('res-naam'), bedrag = nummer('res-bedrag');
      if (!naam || !bedrag) { alert('Naam en bedrag invullen.'); return; }
      state.reserveringen.push({
        id: S.id(), naam: naam, bedrag: bedrag,
        inlegMaand: waarde('res-inleg') || ui.maand,
        verwachteMaand: waarde('res-verwacht') || ui.maand,
        betaaldMaand: null
      });
      bewaar(); render();
    },
    'reservering-afvinken': function (d) {
      state.reserveringen.forEach(function (r) { if (r.id === d.id) r.betaaldMaand = ui.maand; });
      bewaar(); render();
    },
    'reservering-open': function (d) {
      state.reserveringen.forEach(function (r) { if (r.id === d.id) r.betaaldMaand = null; });
      bewaar(); render();
    },
    'reservering-weg': function (d) {
      state.reserveringen = state.reserveringen.filter(function (r) { return r.id !== d.id; });
      bewaar(); render();
    },

    'voorschot-erbij': function () {
      var naam = waarde('vs-naam'), bedrag = nummer('vs-bedrag');
      if (!naam || !bedrag) { alert('Naam en bedrag invullen.'); return; }
      state.voorschotten.push({
        id: S.id(), naam: naam, bedrag: bedrag,
        maand: waarde('vs-maand') || ui.maand, terugbetaaldMaand: null
      });
      bewaar(); render();
    },
    'voorschot-terug': function (d) {
      state.voorschotten.forEach(function (v) { if (v.id === d.id) v.terugbetaaldMaand = ui.maand; });
      bewaar(); render();
    },
    'voorschot-open': function (d) {
      state.voorschotten.forEach(function (v) { if (v.id === d.id) v.terugbetaaldMaand = null; });
      bewaar(); render();
    },
    'voorschot-weg': function (d) {
      state.voorschotten = state.voorschotten.filter(function (v) { return v.id !== d.id; });
      bewaar(); render();
    },

    'vastelast-erbij': function () {
      state.instellingen.vasteLastenOverig.push({ naam: '', bedrag: 0 });
      bewaar(); render();
    },
    'vastelast-weg': function (d) {
      state.instellingen.vasteLastenOverig.splice(parseInt(d.i, 10), 1);
      bewaar(); render();
    },
    'trede-erbij': function () {
      var l = state.instellingen.autoLadder;
      var hoogste = l.length ? M.getal(l[l.length - 1].vanaf) : 0;
      l.push({ naam: 'Nieuwe trede', vanaf: hoogste + 10000 });
      bewaar(); render();
    },
    'trede-weg': function (d) {
      state.instellingen.autoLadder.splice(parseInt(d.i, 10), 1);
      bewaar(); render();
    },

    export: function () {
      var naam = 'salaris-monitor-' + M.maandSleutel() + '.json';
      var json = JSON.stringify(state, null, 2);
      if (root.bewaarBestand) { root.bewaarBestand(naam, json); return; }
      var blob = new Blob([json], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = naam;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    },
    import: function () { document.getElementById('import-bestand').click(); },
    reset: function () {
      if (!confirm('Alles wissen? Alle maanden, reserveringen en instellingen verdwijnen.')) return;
      S.wissen(); state = S.leeg(); render();
    }
  };

  document.addEventListener('click', function (e) {
    var knop = e.target.closest('[data-actie]');
    if (!knop || knop.tagName === 'SELECT') return;
    var fn = acties[knop.dataset.actie];
    if (fn) { e.preventDefault(); fn(knop.dataset); }
  });

  // Voor de opslaglaag van de gedeelde versie.
  root.App = {
    ui: ui,
    render: function () { render(); },
    state: function () { return state; }
  };

  // ------------------------------------------------------------------- start
  document.addEventListener('DOMContentLoaded', function () {
    el.app = document.getElementById('app');
    el.tabs = document.querySelector('nav.tabs');
    render();
  });
})(window);

</script>
